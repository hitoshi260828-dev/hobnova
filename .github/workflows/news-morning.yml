name: NEWS publish (morning)

# NEWS朝版の自動投稿。通常記事（daily-publish-check.yml、JST12:00、1日1本）とは
# scheduler・対象ディレクトリ・PR検出方式のいずれも完全に独立している。
# 夜版はnews-evening.ymlという別ファイル（朝夜で分離。ログ・失敗箇所の分離、再実行の
# しやすさ、将来の投稿時刻変更のしやすさを優先した設計。1つのworkflowでschedule時刻から
# editionを判定する方式は、cron文字列依存の曖昧な分岐になるため避けた）。
#
# 方針（2026-10-18改訂）: news-publish.mjsはPR作成までしか行わない。mainへのmergeは必ず
# 人間が行う（docs/ai-article-guidelines.md 9章）。このworkflow自体も同様にmergeを行わない。
#
# 投稿時刻: JST 08:00 = UTC 23:00（前日）。通常記事 daily-publish-check.yml（JST 12:00 =
# UTC 03:00）とは4時間離れており重ならない。NEWS夜版（news-evening.yml、JST 20:00 =
# UTC 11:00）とも時間帯が重ならない。
#
# 実機確認済み（2026-10-17、workflow_dispatch・dry_run=false・force_date指定）:
# fresh runner上でのnpm ci成功、research/cover生成成功、ローカルcheck成功、
# GITHUB_TOKEN起点でのPR作成成功（リポジトリのActions設定
# "Allow GitHub Actions to create and approve pull requests" を有効化した上で）、
# LINE通知API呼び出し成功、二重起動防止（idempotency check・concurrency）が機能することを
# 確認済み。このPRでschedule行を有効化する。
#
# 二重起動防止: concurrency group（下記）により同一workflowの重複実行は直列化される。
# news-publish.mjs側でも、当日分のファイルがmainに既にあれば即終了する冪等性チェックと、
# 同branchに既にopen PRがあれば再生成せず案内のみ再送する重複防止チェックの両方がある
# （再実行時も安全。研究・画像生成コストを再度払わない）。
on:
  schedule:
    - cron: '0 23 * * *' # UTC 23:00（前日） = JST 08:00（朝版）
  workflow_dispatch:
    inputs:
      dry_run:
        description: "trueにするとOpenAI APIを呼ばず、GitHubへの書き込みも行わない"
        required: false
        default: true
        type: boolean
      skip_publish:
        description: "trueにすると記事生成まで行い、commit/push/PR作成は行わない"
        required: false
        default: false
        type: boolean
      force_date:
        description: "テスト用。YYYY-MM-DD形式で「今日」を上書きする（省略時はJSTの実日付）"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: news-publish-morning
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies (npm ci)
        run: npm ci

      - name: Run news publish (morning)
        env:
          GH_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NEWS_TEXT_MODEL: ${{ vars.NEWS_TEXT_MODEL }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          EDITION: morning
          DRY_RUN: ${{ inputs.dry_run }}
          SKIP_PUBLISH: ${{ inputs.skip_publish }}
          FORCE_DATE: ${{ inputs.force_date }}
        run: node scripts/news-publish.mjs
