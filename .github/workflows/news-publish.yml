name: NEWS publish (morning/evening)

# NEWS朝版/夜版の自動投稿。通常記事（daily-publish-check.yml、JST12:00、1日1本）とは
# scheduler・対象ディレクトリ・PR検出方式のいずれも完全に独立している。
#
# 提案する投稿時刻（まだschedule登録はしていない。下記コメントアウトを参照）:
#   朝版: JST 07:30 = UTC 22:30（前日）  -- 1日を始める前に読める時間、深夜〜早朝の動きを含められる
#   夜版: JST 19:30 = UTC 10:30         -- 日本市場の引け後・帰宅〜夕食時間帯、1日の動きを総括できる
#   通常記事 JST 12:00 とは重ならない。
#
# 重要: 現時点では workflow_dispatch のみで、schedule トリガーは意図的に未登録。
# このworkflow（= news-publish.mjs）はDRY_RUNでしか動作検証していないため、実行するたびに
# OpenAI APIへの課金が発生する本番実行を無人のcronで走らせる前に、まず人間が明示的に
# workflow_dispatchで最低1回成功を確認してから、下記のschedule行をコメント解除して
# 有効化することを想定している。
on:
  # schedule:
  #   - cron: '30 22 * * *' # UTC 22:30 = JST 07:30（朝版）
  #   - cron: '30 10 * * *' # UTC 10:30 = JST 19:30（夜版）
  workflow_dispatch:
    inputs:
      edition:
        description: "朝版 or 夜版"
        required: true
        type: choice
        options:
          - morning
          - evening
      dry_run:
        description: "trueにするとOpenAI APIを呼ばず、GitHubへの書き込みも行わない"
        required: false
        default: true
        type: boolean
      skip_publish:
        description: "trueにするとPR作成まで行い、自動マージはしない"
        required: false
        default: false
        type: boolean
      force_date:
        description: "テスト用。YYYY-MM-DD形式で「今日」を上書きする（省略時はJSTの実日付）"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: news-publish-${{ inputs.edition }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run news publish
        env:
          GH_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NEWS_TEXT_MODEL: ${{ vars.NEWS_TEXT_MODEL }}
          NEWS_IMAGE_MODEL: ${{ vars.NEWS_IMAGE_MODEL }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          EDITION: ${{ inputs.edition }}
          DRY_RUN: ${{ inputs.dry_run }}
          SKIP_PUBLISH: ${{ inputs.skip_publish }}
          FORCE_DATE: ${{ inputs.force_date }}
        run: node scripts/news-publish.mjs
