name: Article ready notification

on:
  workflow_run:
    workflows: ["PR Check"]
    types: [completed]

permissions:
  contents: read
  pull-requests: write

jobs:
  notify:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.pull_requests[0].base.ref == 'main'
    runs-on: ubuntu-latest
    concurrency:
      group: article-ready-${{ github.event.workflow_run.pull_requests[0].number }}
      cancel-in-progress: false
    steps:
      # workflow_runではPRのコードでなくmainの通知スクリプトだけを実行する。
      - name: Checkout trusted notification code
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Notify article ready
        env:
          GH_TOKEN: ${{ github.token }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: node scripts/notify-article-ready.mjs
