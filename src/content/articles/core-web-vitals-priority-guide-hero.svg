<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024" role="img" aria-labelledby="title description">
  <title id="title">Core Web Vitalsの3指標を表すダッシュボード</title>
  <desc id="description">ブラウザ画面にLCP、INP、CLSの3つのゲージと改善度を示すスライダーを配置した図</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f8fafc" />
      <stop offset="1" stop-color="#eaf2ff" />
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#2563eb" />
      <stop offset="1" stop-color="#60a5fa" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#111827" flood-opacity=".13" />
    </filter>
  </defs>
  <rect width="1536" height="1024" fill="url(#background)" />
  <g fill="#bfdbfe" opacity=".45">
    <circle cx="116" cy="130" r="8" />
    <circle cx="1420" cy="158" r="10" />
    <circle cx="1372" cy="886" r="7" />
    <circle cx="176" cy="856" r="11" />
  </g>
  <path d="M0 820C360 735 620 928 1010 820c230-64 360-46 526-92v296H0Z" fill="#fff" opacity=".8" />
  <g filter="url(#shadow)">
    <rect x="228" y="182" width="1080" height="660" rx="42" fill="#fff" />
    <path d="M270 182h996a42 42 0 0 1 42 42v62H228v-62a42 42 0 0 1 42-42Z" fill="#111827" />
    <circle cx="292" cy="234" r="11" fill="#60a5fa" />
    <circle cx="330" cy="234" r="11" fill="#94a3b8" />
    <circle cx="368" cy="234" r="11" fill="#e5e7eb" />
    <rect x="1008" y="218" width="230" height="31" rx="15.5" fill="#374151" />
  </g>
  <g transform="translate(0 4)">
    <g transform="translate(425 500)">
      <circle r="126" fill="none" stroke="#e5e7eb" stroke-width="30" />
      <circle r="126" fill="none" stroke="url(#blue)" stroke-width="30" stroke-linecap="round" stroke-dasharray="610 792" transform="rotate(-90)" />
      <text y="-2" text-anchor="middle" font-family="Arial, sans-serif" font-size="45" font-weight="700" fill="#111827">LCP</text>
      <text y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" fill="#64748b">LOADING</text>
    </g>
    <g transform="translate(768 500)">
      <circle r="126" fill="none" stroke="#e5e7eb" stroke-width="30" />
      <circle r="126" fill="none" stroke="#1d4ed8" stroke-width="30" stroke-linecap="round" stroke-dasharray="675 792" transform="rotate(-90)" />
      <text y="-2" text-anchor="middle" font-family="Arial, sans-serif" font-size="45" font-weight="700" fill="#111827">INP</text>
      <text y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" fill="#64748b">RESPONSE</text>
    </g>
    <g transform="translate(1111 500)">
      <circle r="126" fill="none" stroke="#e5e7eb" stroke-width="30" />
      <circle r="126" fill="none" stroke="#60a5fa" stroke-width="30" stroke-linecap="round" stroke-dasharray="705 792" transform="rotate(-90)" />
      <text y="-2" text-anchor="middle" font-family="Arial, sans-serif" font-size="45" font-weight="700" fill="#111827">CLS</text>
      <text y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" fill="#64748b">STABILITY</text>
    </g>
  </g>
  <g transform="translate(358 718)">
    <rect width="820" height="8" rx="4" fill="#e5e7eb" />
    <rect width="555" height="8" rx="4" fill="#3b82f6" />
    <circle cx="555" cy="4" r="20" fill="#fff" stroke="#3b82f6" stroke-width="9" />
  </g>
</svg>
