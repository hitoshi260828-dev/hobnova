<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="100%" stop-color="#eef8f0"/>
    </linearGradient>
    <linearGradient id="matter" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a66d8"/>
      <stop offset="100%" stop-color="#4c9df6"/>
    </linearGradient>
    <linearGradient id="thread" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a8f4d"/>
      <stop offset="100%" stop-color="#38b96b"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".14"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <circle cx="140" cy="120" r="90" fill="#d9ecff" opacity=".75"/>
  <circle cx="1460" cy="140" r="110" fill="#dff4e5" opacity=".8"/>
  <ellipse cx="800" cy="780" rx="650" ry="90" fill="#d9e5df" opacity=".55" filter="url(#soft)"/>

  <text x="800" y="110" text-anchor="middle" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="82" font-weight="800" fill="#10233e">
    MatterとThreadの違い
  </text>
  <text x="800" y="175" text-anchor="middle" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="34" font-weight="600" fill="#475569">
    スマートホーム規格をわかりやすく整理
  </text>

  <g filter="url(#shadow)">
    <rect x="90" y="250" width="480" height="370" rx="36" fill="#ffffff"/>
    <rect x="1030" y="250" width="480" height="370" rx="36" fill="#ffffff"/>
  </g>

  <rect x="90" y="250" width="480" height="95" rx="36" fill="url(#matter)"/>
  <rect x="1030" y="250" width="480" height="95" rx="36" fill="url(#thread)"/>

  <text x="330" y="318" text-anchor="middle" font-family="Arial, sans-serif" font-size="58" font-weight="800" fill="#fff">Matter</text>
  <text x="1270" y="318" text-anchor="middle" font-family="Arial, sans-serif" font-size="58" font-weight="800" fill="#fff">Thread</text>

  <text x="330" y="405" text-anchor="middle" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="38" font-weight="800" fill="#0a66d8">共通言語</text>
  <text x="330" y="465" text-anchor="middle" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="29" fill="#334155">メーカーをこえて</text>
  <text x="330" y="505" text-anchor="middle" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="29" fill="#334155">機器どうしをつなぐ規格</text>

  <text x="1270" y="405" text-anchor="middle" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="38" font-weight="800" fill="#0a8f4d">通信方式</text>
  <text x="1270" y="465" text-anchor="middle" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="29" fill="#334155">低消費電力でつながる</text>
  <text x="1270" y="505" text-anchor="middle" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="29" fill="#334155">メッシュネットワーク</text>

  <g transform="translate(630 275)" filter="url(#shadow)">
    <rect width="340" height="160" rx="32" fill="#eaf4ff" stroke="#8cc6ff" stroke-width="3"/>
    <text x="170" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="42" font-weight="800" fill="#0a66d8">Matter</text>
    <text x="170" y="112" text-anchor="middle" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="27" font-weight="700" fill="#334155">アプリケーション層</text>
  </g>

  <g transform="translate(630 465)" filter="url(#shadow)">
    <rect width="340" height="160" rx="32" fill="#ecf9f0" stroke="#8bd8a7" stroke-width="3"/>
    <text x="170" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="42" font-weight="800" fill="#0a8f4d">Thread</text>
    <text x="170" y="112" text-anchor="middle" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="27" font-weight="700" fill="#334155">通信レイヤー</text>
  </g>

  <path d="M570 415 C600 415 610 355 630 355" fill="none" stroke="#4c9df6" stroke-width="7" stroke-dasharray="10 12"/>
  <path d="M1030 415 C1000 415 990 355 970 355" fill="none" stroke="#38b96b" stroke-width="7" stroke-dasharray="10 12"/>
  <path d="M800 435 L800 465" stroke="#64748b" stroke-width="7" stroke-linecap="round"/>

  <g transform="translate(220 690)">
    <rect x="0" y="0" width="1160" height="135" rx="38" fill="#fff" opacity=".92" filter="url(#shadow)"/>
    <g transform="translate(70 35)">
      <circle cx="30" cy="30" r="28" fill="#ffd95c"/>
      <rect x="20" y="16" width="20" height="28" rx="9" fill="#fff6c7"/>
      <rect x="25" y="44" width="10" height="8" rx="3" fill="#8a6b00"/>
      <text x="88" y="39" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="28" font-weight="700" fill="#334155">スマート電球</text>
    </g>
    <g transform="translate(360 35)">
      <rect x="6" y="2" width="52" height="58" rx="14" fill="#2d3748"/>
      <circle cx="32" cy="30" r="8" fill="#cbd5e1"/>
      <text x="84" y="39" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="28" font-weight="700" fill="#334155">スマートロック</text>
    </g>
    <g transform="translate(675 35)">
      <rect x="0" y="0" width="70" height="62" rx="17" fill="#e2e8f0"/>
      <text x="35" y="39" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" font-weight="800" fill="#334155">24°</text>
      <text x="95" y="39" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="28" font-weight="700" fill="#334155">センサー</text>
    </g>
    <g transform="translate(930 35)">
      <ellipse cx="36" cy="34" rx="42" ry="28" fill="#475569"/>
      <path d="M8 34 Q36 8 64 34" fill="none" stroke="#94a3b8" stroke-width="5"/>
      <text x="95" y="39" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="28" font-weight="700" fill="#334155">ハブ</text>
    </g>
  </g>
</svg>